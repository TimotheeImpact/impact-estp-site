    fiche: "autodesk"
  - nom: "Aecon"
    logo: ""
    fiche: "aecon"
  - nom: "VNF"
    logo: ""
    fiche: "vnf"
  - nom: "CDC Habitat"
    logo: "cdc-habitat.png"
    fiche: "cdc-habitat"
  - nom: "Syndicat des énergies renouvelables"
    logo: "ser.png"
    fiche: "ser"
  - nom: "Prosolia Energy"
    logo: "prosolia-energy.png"
    fiche: "prosolia-energy"
  - nom: "S3D-SPAD"
    logo: "s3d-spad.png"
    fiche: "s3d-spad"
