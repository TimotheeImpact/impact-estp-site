# ─────────────────────────────────────────────────────────────
#  Réglages techniques : pas besoin d'y toucher
# ─────────────────────────────────────────────────────────────
timezone: Europe/Paris
markdown: kramdown
kramdown:
  input: GFM
permalink: /presse/:title/

# Fiches : en français dans _interviews et _entreprises ; traductions dans les dossiers _en, _it et _de
# (même nom de fichier, seulement le titre, le poste et le texte traduits).
collections:
  interviews:
    output: true
    permalink: /interviews/:name/
  entreprises:
    output: true
    permalink: /entreprises/:name/
  interviews_en:
    output: true
    permalink: /en/interviews/:name/
  interviews_it:
    output: true
    permalink: /it/interviews/:name/
  entreprises_en:
    output: true
    permalink: /en/entreprises/:name/
  entreprises_it:
    output: true
    permalink: /it/entreprises/:name/
  interviews_de:
    output: true
    permalink: /de/interviews/:name/
  entreprises_de:
    output: true
    permalink: /de/entreprises/:name/

# Langue de chaque page : français par défaut, anglais dans le dossier en/, italien dans it/, allemand dans de/.
defaults:
  - scope: { path: "" }
    values: { image: /assets/img/partage.png, lang: fr, prefixe: "", locale: fr_FR }
  - scope: { path: "en" }
    values: { lang: en, prefixe: "/en", locale: en_GB }
  - scope: { path: "it" }
    values: { lang: it, prefixe: "/it", locale: it_IT }
  - scope: { path: "de" }
    values: { lang: de, prefixe: "/de", locale: de_DE }
  - scope: { path: "", type: posts }
    values: { layout: article, sans_traduction: true }
  - scope: { path: "", type: interviews }
    values: { layout: interview }
  - scope: { path: "", type: entreprises }
    values: { layout: entreprise }
  - scope: { path: "", type: interviews_en }
    values: { layout: interview, lang: en, prefixe: "/en", locale: en_GB }
  - scope: { path: "", type: interviews_it }
    values: { layout: interview, lang: it, prefixe: "/it", locale: it_IT }
  - scope: { path: "", type: entreprises_en }
    values: { layout: entreprise, lang: en, prefixe: "/en", locale: en_GB }
  - scope: { path: "", type: entreprises_it }
    values: { layout: entreprise, lang: it, prefixe: "/it", locale: it_IT }
  - scope: { path: "", type: interviews_de }
    values: { layout: interview, lang: de, prefixe: "/de", locale: de_DE }
  - scope: { path: "", type: entreprises_de }
    values: { layout: entreprise, lang: de, prefixe: "/de", locale: de_DE }

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: presse/flux.xml

# Dossier caché à publier quand même : /.well-known/security.txt (adresse pour signaler une faille)
include:
  - .well-known

exclude:
  - README.md
  - modeles/
  - Gemfile
  - Gemfile.lock
  - vendor/
