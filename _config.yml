# ─────────────────────────────────────────────────────────────
#  Réglages du site Impact ESTP
#  Tu peux modifier les textes entre guillemets sans risque.
#  Après une modification, le site se met à jour tout seul en 1 à 2 minutes.
# ─────────────────────────────────────────────────────────────

title: "Impact ESTP"
tagline: "Le média étudiant de la construction et de l'énergie"
slogan: "Construis ton impact."    # affiché en bas à gauche, à côté du logo
description: "Le média étudiant de la construction et de l'énergie. Chaque semaine, une interview vidéo avec un dirigeant, un ingénieur ou un entrepreneur du BTP et de l'énergie."
lang: fr_FR

# Adresse du site (le fichier CNAME à la racine du dépôt doit contenir la même adresse, sans https://).
url: "https://impactestp.fr"
baseurl: ""

# ── Coordonnées ──────────────────────────────────────────────
email: "contact@impactestp.fr"     # adresse de contact affichée sur le site
youtube: "https://www.youtube.com/@ImpactESTP"
linkedin: "https://www.linkedin.com/company/impact-estp"
instagram: "https://www.instagram.com/impact.estp/"

# ── Chiffres affichés sur la page d'accueil ──────────────────
chiffres:
  - auto: publiees                # calculé tout seul à partir des fiches interviews
    legende: "interviews publiées"
  - auto: montage                 # fiches avec post_prod: true
    legende: "en montage"
  - valeur: "FR · IT"
    legende: "interviews en français et en italien"
  - valeur: "1/sem."
    legende: "nouvelle interview"

# Entreprises dont viennent nos invités (bandeau de la page d'accueil)
invites_entreprises:
  - Bouygues
  - Eiffage
  - NGE
  - Autodesk
  - Aecon
  - VNF

# ── Presse écrite ────────────────────────────────────────────
presse_rendezvous: "Chaque mardi à 18h"
presse_premier_article: "Mardi 20 octobre 2026"   # vider cette ligne une fois le premier article publié
presse_redaction:
  - nom: "Emma"
    role: "Rédactrice en chef, presse écrite"
  - nom: "Timothée de Varax"
    role: "Directeur de la publication"

# ── Mesure d'audience (sans cookie) ──────────────────────────
# Jeton Cloudflare Web Analytics (une suite de lettres et chiffres, voir le guide).
# Tant que c'est vide, aucune mesure n'est faite.
cloudflare_analytics: ""

# ── Formulaires ──────────────────────────────────────────────
# Adresse d'envoi des formulaires (vivier de stages et candidatures à l'équipe).
# Voir le mode d'emploi dans README.md, partie « Brancher les formulaires ».
# Tant que c'est vide, les formulaires affichent « Ouverture le 15 novembre ».
formulaire_vivier: ""
formulaire_equipe: "https://formsubmit.co/contact@impactestp.fr"

# ── Mentions légales (obligatoires en France) ────────────────
association: "IMPACT ESTP"
siren: "106 074 297"
siege: "28 avenue du Président Wilson, 94230 Cachan"
telephone: "06 95 99 05 01"
rna: "W943012233"                 # numéro du récépissé de la sous-préfecture
directeur_publication: "Timothée de Varax"
role_directeur: "président fondateur de l'association"

# ─────────────────────────────────────────────────────────────
#  Réglages techniques : pas besoin d'y toucher
# ─────────────────────────────────────────────────────────────
timezone: Europe/Paris
markdown: kramdown
kramdown:
  input: GFM
permalink: /presse/:title/

collections:
  interviews:
    output: true
    permalink: /interviews/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: article }
  - scope: { path: "", type: interviews }
    values: { layout: interview }
  - scope: { path: "" }
    values: { image: /assets/img/partage.png }

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: presse/flux.xml

exclude:
  - README.md
  - modeles/
  - Gemfile
  - Gemfile.lock
  - vendor/
