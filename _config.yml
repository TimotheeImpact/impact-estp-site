    legende: "interviews filmées avec des dirigeants, ingénieurs et entrepreneurs"
    legende_en: "filmed interviews with leaders, engineers and entrepreneurs"
    legende_it: "interviste filmate con dirigenti, ingegneri e imprenditori"
    legende_de: "gefilmte Interviews mit Führungskräften, Ingenieuren und Gründern"
  - auto: entreprises
    legende: "entreprises du BTP et de l'énergie à découvrir"
    legende_en: "construction and energy companies to discover"
    legende_it: "aziende dell'edilizia e dell'energia da scoprire"
    legende_de: "Bau- und Energieunternehmen zum Entdecken"
  - valeur: "11 700+"             # impressions LinkedIn sur 12 mois au 1er octobre 2026 (11 761) : à mettre à jour
    valeur_en: "11,700+"
    valeur_it: "11.700+"
    valeur_de: "11.700+"
    legende: "impressions sur LinkedIn en un an"
    legende_en: "LinkedIn impressions in a year"
    legende_it: "visualizzazioni su LinkedIn in un anno"
    legende_de: "Impressionen auf LinkedIn in einem Jahr"
  - auto: evenements
    legende: "salons, forums et conférences dans notre agenda"
    legende_en: "fairs, forums and conferences in our calendar"
    legende_it: "fiere, forum e convegni nel nostro calendario"
    legende_de: "Messen, Foren und Konferenzen in unserem Kalender"

