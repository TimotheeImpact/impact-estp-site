# L'équipe d'Impact ESTP (page À propos, partie « L'équipe »).
# Prénom seulement. « role » est la fonction, « phrase » la petite blague sous le prénom.
# Les champs _en, _it et _de sont les traductions (sans elles, le texte français s'affiche).
# Pour ajouter quelqu'un : copier un bloc entier (du tiret jusqu'à phrase_de) et le coller à la suite.
- prenom: "Timothée"
  role: "Président"
  role_en: "President"
  role_it: "Presidente"
  role_de: "Präsident"
  phrase: "A lancé Impact en mars 2026. Depuis, il ne dit plus bonjour, il dit « tu connais quelqu'un à interviewer ? »"
  phrase_en: "Launched Impact in March 2026. Since then he no longer says hello, he says “know anyone we could interview?”"
  phrase_it: "Ha lanciato Impact a marzo 2026. Da allora non dice più ciao, dice «conosci qualcuno da intervistare?»"
  phrase_de: "Hat Impact im März 2026 gestartet. Seitdem sagt er nicht mehr Hallo, sondern „Kennst du jemanden für ein Interview?“"
- prenom: "Jaïro"
  role: "Vice-président"
  role_en: "Vice-President"
  role_it: "Vicepresidente"
  role_de: "Vizepräsident"
  phrase: "Prend les commandes quand le président est en tournage. Autant dire qu'il ne s'ennuie pas."
  phrase_en: "Takes the wheel when the president is out filming. Safe to say he's never bored."
  phrase_it: "Prende il comando quando il presidente è sul set. Diciamo che non si annoia."
  phrase_de: "Übernimmt das Steuer, wenn der Präsident beim Dreh ist. Langweilig wird ihm also nie."
- prenom: "Lucas"
  role: "Secrétaire général"
  role_en: "Secretary General"
  role_it: "Segretario generale"
  role_de: "Generalsekretär"
  phrase: "Gardien des statuts, des comptes rendus et du tableur que personne d'autre n'ose ouvrir."
  phrase_en: "Keeper of the bylaws, the minutes and the spreadsheet nobody else dares to open."
  phrase_it: "Custode dello statuto, dei verbali e del foglio di calcolo che nessun altro osa aprire."
  phrase_de: "Hüter der Satzung, der Protokolle und der Tabelle, die sonst niemand zu öffnen wagt."
- prenom: "Emma"
  role: "Responsable presse écrite"
  role_en: "Head of written press"
  role_it: "Responsabile stampa scritta"
  role_de: "Leiterin Textredaktion"
  phrase: "Relit chaque article trois fois, au stylo rouge s'il le faut."
  phrase_en: "Proofreads every article three times, with a red pen if needed."
  phrase_it: "Rilegge ogni articolo tre volte, con la penna rossa se serve."
  phrase_de: "Liest jeden Artikel dreimal Korrektur, notfalls mit Rotstift."
- prenom: "Ibrahim"
  role: "Membre"
  role_en: "Member"
  role_it: "Membro"
  role_de: "Mitglied"
  phrase: "Titre officiel : membre. Titre officieux : couteau suisse."
  phrase_en: "Official title: member. Unofficial title: Swiss Army knife."
  phrase_it: "Titolo ufficiale: membro. Titolo ufficioso: coltellino svizzero."
  phrase_de: "Offizieller Titel: Mitglied. Inoffizieller Titel: Schweizer Taschenmesser."
- prenom: "Aruvika"
  role: "Responsable communication"
  role_en: "Head of communications"
  role_it: "Responsabile comunicazione"
  role_de: "Leiterin Kommunikation"
  phrase: "Si Impact est passé dans ton fil LinkedIn ou Insta, c'est de sa faute."
  phrase_en: "If Impact popped up in your LinkedIn or Instagram feed, blame her."
  phrase_it: "Se Impact è comparso nel tuo feed LinkedIn o Instagram, è colpa sua."
  phrase_de: "Wenn Impact in deinem LinkedIn- oder Instagram-Feed aufgetaucht ist, ist sie schuld."
- prenom: "Eric"
  role: "Rédacteur presse écrite"
  role_en: "Press writer"
  role_it: "Redattore stampa scritta"
  role_de: "Redakteur Textredaktion"
  phrase: "Le petit dernier de la rédaction. Il a promis de rendre ses articles à l'heure, on a gardé l'enregistrement."
  phrase_en: "The newest member of the newsroom. He promised to hand in his articles on time, and we kept the recording."
  phrase_it: "L'ultimo arrivato in redazione. Ha promesso di consegnare gli articoli in orario: abbiamo conservato la registrazione."
  phrase_de: "Der Neue in der Redaktion. Er hat versprochen, seine Artikel pünktlich abzugeben, wir haben die Aufnahme behalten."
- prenom: "Luca"
  role: "Monteur vidéo"
  role_en: "Video editor"
  role_it: "Montatore video"
  role_de: "Videoschnitt"
  phrase: "Transforme deux heures de rush en dix minutes qui donnent envie. Les « euh » de l'invité, eux, ne reviennent jamais."
  phrase_en: "Turns two hours of footage into ten minutes worth watching. The guest's “ums” never make it back."
  phrase_it: "Trasforma due ore di girato in dieci minuti che si guardano volentieri. Gli «ehm» dell'ospite, invece, spariscono per sempre."
  phrase_de: "Macht aus zwei Stunden Rohmaterial zehn Minuten, die man gern schaut. Die „Ähms“ des Gastes sieht man nie wieder."
