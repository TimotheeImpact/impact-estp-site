# Agenda des évènements (page Évènements et accueil).
# Les champs _en, _it et _de sont les traductions anglaise, italienne et allemande (facultatives : sans elles, le texte français s'affiche).
# Un évènement organisé par Impact : ajoute « impact: true ».
# Les évènements passés se masquent tout seuls sur le site (on peut les revoir avec « Voir aussi les évènements passés »).
#
# - id: "nom-court-2027"              # en minuscules avec des tirets, unique
#   titre: "Nom de l'évènement"
#   type: "salon"                     # salon, conference, forum-etudiant, concours, job-dating, portes-ouvertes
#   themes: ["construction"]          # construction, travaux-publics, energie, immobilier, ville-durable, architecture
#   ville: "Paris"
#   lieu: "Nom du lieu"
#   region: "Île-de-France"
#   debut: "2027-03-15"               # année-mois-jour
#   fin: "2027-03-17"
#   lien: "https://..."
#   organisateur: "Qui l'organise"
#   public: "tous"                    # etudiants, professionnels (sans accès étudiant annoncé), tous
#   entree: "gratuit"                 # pour un étudiant : gratuit, payant, sur-inscription, variable, reserve-ecole
#   etudiants: "Ce qu'un étudiant y gagne."
#   description: "Une phrase sur l'évènement."

- id: "colloque-france-renouvelables-2026"
  titre: "16e Colloque national de France Renouvelables"
  titre_en: "16th National Conference of France Renouvelables"
  titre_it: "16° Convegno nazionale di France Renouvelables"
  titre_de: "16. Nationales Kolloquium von France Renouvelables"
  type: "conference"
  themes: ["energie"]
  ville: "Paris"
  lieu: "Parc Floral de Paris"
  region: "Île-de-France"
  debut: "2026-10-07"
  fin: "2026-10-08"
  lien: "https://www.france-renouvelables.fr/agenda/colloque-national-de-france-renouvelables/"
  organisateur: "France Renouvelables"
  public: "professionnels"
  entree: "variable"
  etudiants: "Idéal pour comprendre les enjeux de l'éolien, du solaire et du stockage et repérer les développeurs de projets ; l'organisateur annonce des représentants de la jeunesse, sans tarif étudiant publié."
  etudiants_en: "Ideal for understanding wind, solar and storage issues and spotting project developers; the organiser mentions youth representatives but publishes no student rate."
  etudiants_it: "Ideale per capire le sfide di eolico, solare e accumulo e individuare gli sviluppatori di progetti; l'organizzatore annuncia rappresentanti dei giovani, ma nessuna tariffa studenti."
  etudiants_de: "Ideal, um die Herausforderungen von Windkraft, Solarenergie und Speichern zu verstehen und Projektentwickler kennenzulernen; der Veranstalter kündigt Vertreterinnen und Vertreter der Jugend an, veröffentlicht aber keinen Studierendentarif."
  description: "Rendez-vous annuel des énergies renouvelables électriques (éolien, solaire, stockage, flexibilité) réunissant professionnels, experts et élus."
  description_en: "Annual gathering of the renewable electricity sector (wind, solar, storage, flexibility) bringing together professionals, experts and elected officials."
  description_it: "Appuntamento annuale delle rinnovabili elettriche (eolico, solare, accumulo, flessibilità) che riunisce professionisti, esperti ed eletti."
  description_de: "Jährliches Branchentreffen der erneuerbaren Stromerzeugung (Windkraft, Solarenergie, Speicher, Flexibilität), das Fachleute, Expertinnen und Experten sowie gewählte Volksvertreter zusammenbringt."

- id: "congres-amorce-2026"
