  etudiants_en: "A good way to see how local authorities run heat networks, energy, water and waste; no student rate is shown and registration has already closed."
  etudiants_it: "Un buon modo per vedere come gli enti locali gestiscono reti di calore, energia, acqua e rifiuti; nessuna tariffa studenti e iscrizioni già chiuse."
  etudiants_de: "Gute Gelegenheit zu sehen, wie Kommunen Wärmenetze, Energie, Wasser und Abfall steuern; es wird kein Studierendentarif angegeben, und die Anmeldung ist bereits geschlossen."
  description: "Congrès national des collectivités sur les services publics de l'eau, de l'énergie et des déchets, à Lyon pour sa 40e édition."
  description_en: "National congress for local authorities on public water, energy and waste services, held in Lyon for its 40th edition."
  description_it: "Congresso nazionale degli enti locali sui servizi pubblici di acqua, energia e rifiuti, a Lione per la 40ª edizione."
  description_de: "Nationaler Kongress der Kommunen zu den öffentlichen Diensten für Wasser, Energie und Abfall, der für seine 40. Ausgabe in Lyon stattfindet."

- id: "forum-eivp-2026"
  titre: "Forum EIVP Rencontre Entreprises"
