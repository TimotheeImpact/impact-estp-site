  entree: "reserve-ecole"
  etudiants: "Près de 50 entreprises et institutions du BTP, de la mobilité, de l'eau, de l'énergie et de l'aménagement viennent rencontrer les élèves de l'EIVP pour des stages, alternances et premiers emplois ; le forum s'adresse d'abord aux élèves de l'école."
  etudiants_en: "Nearly 50 companies and public bodies from construction, mobility, water, energy and urban planning meet EIVP students for internships, apprenticeships and first jobs; the forum is mainly for the school's own students."
  etudiants_it: "Quasi 50 aziende e enti dell'edilizia, della mobilità, dell'acqua, dell'energia e della pianificazione incontrano gli studenti dell'EIVP per tirocini, apprendistati e primi impieghi; il forum è rivolto soprattutto agli studenti della scuola."
  etudiants_de: "Fast 50 Unternehmen und Institutionen aus Bauwesen, Mobilität, Wasser, Energie und Stadt- und Raumplanung kommen, um Studierende der EIVP für Praktika, duale Studienplätze und Einstiegsstellen kennenzulernen; die Messe richtet sich in erster Linie an Studierende der Hochschule."
  description: "18e édition du forum entreprises de l'EIVP, l'école du génie urbain, avec près de 50 acteurs de la ville, du BTP et de l'énergie."
  description_en: "18th company forum of EIVP, the urban engineering school, with nearly 50 players from city services, construction and energy."
  description_it: "18ª edizione del forum aziende dell'EIVP, la scuola di ingegneria urbana, con quasi 50 attori della città, dell'edilizia e dell'energia."
  description_de: "18. Ausgabe der Karrieremesse der EIVP, der Hochschule für Stadtingenieurwesen, mit fast 50 Akteuren aus Stadt, Bauwesen und Energie."

