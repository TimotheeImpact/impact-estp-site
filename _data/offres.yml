# Offres présentées sur la page Entreprises
- etiquette: Marque employeur
  titre: Contenu partenaire
  texte: Une interview d'un de vos dirigeants ou ingénieurs, tournée en studio ou chez vous.
  points:
    - Diffusion sur YouTube, LinkedIn et le site
    - 3 à 5 extraits courts pour les réseaux
    - Mention « Collaboration commerciale », comme la loi l'exige
- etiquette: Sur le terrain
  titre: Pack Chantier
  texte: Une série de vidéos tournées sur l'un de vos chantiers, pour montrer le métier tel qu'il est.
  points:
    - 3 vidéos tournées sur site
    - Droits d'usage pour vos propres canaux
    - Diffusion à notre audience étudiante
- etiquette: Recrutement
  titre: Stagiaires présélectionnés
  texte: Nous diffusons votre offre à notre vivier et vous présentons trois profils motivés.
  points:
    - Offre relayée sur nos canaux
    - 3 profils présentés, avec leur accord
    - Paiement seulement si vous recrutez
