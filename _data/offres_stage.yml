# Les champs _en et _it sont les traductions anglaise et italienne (facultatives : sans elles, le texte français s'affiche).
# Offres de stage, d'alternance ou d'emploi proposées par les entreprises (page Stages).
# Pour ajouter une offre : enlève les # devant le bloc d'exemple, remplis-le, et garde les espaces.
# entreprise_id = nom du fichier de l'entreprise dans _entreprises (sans .md), pour afficher son logo et un lien vers sa fiche.
# lien = page de l'offre chez l'entreprise, ou le formulaire de contact (/contact/?objet=Stage&offre=Nom de l'offre) ;
#        si vide, le bouton propose de postuler via le vivier Impact.
#
# - titre: "Stage assistant conducteur de travaux"
