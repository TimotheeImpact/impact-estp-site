#   entreprise_id: "nge"
#   type: "Stage"              # Stage, Alternance, CDI, VIE…
#   lieu: "Île-de-France"
#   duree: "6 mois"
#   debut: "Février 2027"
#   description: "Deux ou trois phrases sur les missions et le profil recherché."
#   lien: ""

