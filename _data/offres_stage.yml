# Les champs _en, _it et _de sont les traductions anglaise, italienne et allemande (facultatives : sans elles, le texte français s'affiche).
# Offres de stage, d'alternance ou d'emploi proposées par les entreprises (page Stages).
# Pour ajouter une offre : enlève les # devant le bloc d'exemple, remplis-le, et garde les espaces.
# entreprise_id = nom du fichier de l'entreprise dans _entreprises (sans .md), pour afficher son logo et un lien vers sa fiche.
# lien = page de l'offre chez l'entreprise, ou le formulaire de contact (/contact/?objet=Stage&offre=Nom de l'offre) ;
#        si vide, le bouton propose de postuler via le vivier Impact.
# source = « impact » pour une offre trouvée par le réseau d'Impact ESTP (affichée en haut de la page Stages),
#          « jobteaser » pour une offre de l'ESTP sur JobTeaser, publiée avec l'accord écrit de l'entreprise.
# categorie (offres JobTeaser seulement) = « ciblee » (candidat ESTP recherché), « partenaire » (entreprise partenaire
#          de l'école) ou « reseau » (postée par des alumni ou des étudiants). Voir aussi _data/jobteaser.yml.
#
# - titre: "Stage assistant conducteur de travaux"
#   titre_en: "Assistant site manager internship"
#   titre_it: "Stage come assistente direttore di cantiere"
#   titre_de: "Praktikum als Assistent der Bauleitung"
#   entreprise: "NGE"
#   entreprise_id: "nge"
#   type: "Stage"              # Stage, Alternance, CDI, VIE…
#   lieu: "Île-de-France"
#   duree: "6 mois"
#   debut: "Février 2027"
#   description: "Deux ou trois phrases sur les missions et le profil recherché."
#   lien: ""
#   source: "impact"           # impact ou jobteaser
#   categorie: ""              # pour jobteaser : ciblee, partenaire ou reseau

