  ecris: "<b>Schreib für Impact.</b> Ob Studierende, Alumni oder Lehrende: Schlag einen Gastbeitrag oder einen Erfahrungsbericht aus deinem Praktikum vor, in Frankreich oder im Ausland."
  proposer: "Thema vorschlagen"
  charte: "Unsere Leitlinien"
  charte_points:
    - "<b>Null KI in unseren Artikeln</b>: Studierende schreiben und lektorieren sie, ohne jeden von künstlicher Intelligenz erzeugten Text."
    - "<b>Jede Zahl ist belegt</b>, mit einem Link zur Quelle."
    - "<b>Jedes Zitat wird autorisiert</b>: Die zitierte Person liest es vor der Veröffentlichung gegen."
    - "<b>Ein klarer Ton</b>, verständlich und ohne unerklärten Fachjargon."
    - "<b>Keine versteckte Werbung</b>: Ein von einem Partner finanzierter Artikel trägt den Hinweis „Partnerschaft“."
    - "<b>Lizenzfreie Bilder</b> oder Bilder vom Unternehmen, immer mit Quellenangabe."

