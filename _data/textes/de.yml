stages:
  label: "Praktika und Berufseinstieg"
  titre: "Dein Praktikum in Bau und Energie"
  intro: "Komm in den Talentpool, entdecke die Angebote der Unternehmen und bereite deine Bewerbungen mit unseren Unternehmenssteckbriefen vor."
  vivier_label: "Der Talentpool"
  vivier_titre: "Komm in den Impact-Talentpool"
  vivier_intro: "Die Unternehmen, die wir interviewen, suchen Praktikanten und junge Ingenieure. Hinterlass uns dein Profil: Wenn ein Angebot passt, schicken wir es dir zuerst."
  etape1: "Du füllst das Formular in einer Minute aus. Kostenlos."
  etape2: "Wir melden uns, wenn ein Angebot zu deiner Suche passt: Praktikum, Werkstudium oder duales Studium, feste Stelle."
  etape3: "Du entscheidest, ob dein Profil dem Unternehmen vorgestellt wird. Ohne deine Zustimmung geben wir nichts weiter."
  bientot_espace: "Praktikumsberichte und anonyme Bewertungen von Unternehmen, geteilt von Studierenden in einem Mitgliederbereich."
  ouverture: "Die Anmeldung startet am 15. November 2026."
  offres_label: "Angebote der Unternehmen"
  offres_titre: "Die Praktikumsangebote"
  offres_intro: "Praktika, Werkstudium oder duales Studium und Einstiegsstellen bei Unternehmen aus Bau und Energie, die mit Impact zusammenarbeiten."
  offres_vide: "Die ersten Angebote erscheinen hier. Trag dich in den Talentpool ein, dann bekommst du sie zuerst"
  offres_vide_date: ", ab dem Start am 15. November 2026"
  recrutez: "<b>Sie stellen ein?</b> Schicken Sie uns Ihr Angebot für ein Praktikum, ein Werkstudium oder duales Studium oder eine Stelle: Wir veröffentlichen es hier und leiten es an die passenden Profile im Talentpool weiter."
  proposer_offre: "Angebot einreichen"
  entreprises_label: "Vor der Bewerbung"
  entreprises_titre: "Entdecke die Unternehmen"
  entreprises_intro: "Jeder Steckbrief bündelt unsere Interviews, unsere Artikel und die Angebote des Unternehmens. So gehst du ins Vorstellungsgespräch und weißt, wovon du redest."
  faq_label: "Fragen"
  faq_titre: "Häufige Fragen"
  faq:
    - q: "Kostet das etwas?"
      r: "Nein. Der Talentpool ist für Studierende und Absolventen kostenlos, und das bleibt auch so."
    - q: "Wer sieht meine Daten?"
      r: "Nur das Team von Impact ESTP. Ein Unternehmen bekommt dein Profil nur, wenn du für genau dieses Angebot zugestimmt hast."
    - q: "Ich bin nicht an der ESTP. Kann ich mich trotzdem anmelden?"
      r: "Ja. Der Talentpool ist offen für alle Studierenden, die in den Hochbau, den Tiefbau oder die Energiebranche wollen, egal an welcher Hochschule."
    - q: "Wie melde ich mich ab?"
      r: "Schreib uns an %email%, dann löschen wir deine Daten."

