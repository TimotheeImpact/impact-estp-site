apropos:
  label: "Über uns"
  titre: "Die Branche zeigen, wie sie wirklich ist: durch die Menschen, die sie prägen"
  intro: "Impact ESTP ist das erste studentische Medium für Bau und Energie."
  pourquoi_titre: "Warum Impact"
  pourquoi:
    - "Von Studierenden wird erwartet, dass sie sich für eine Branche entscheiden, die sie kaum kennen und von der man ihnen nur eine Seite zeigt. Dabei sind die Berufe in Bau und Energie unglaublich vielfältig."
    - "Im März 2026 haben Studierende der ESTP Paris Impact gegründet, um das zu ändern: ungefilterte Videointerviews von 25 bis 50 Minuten mit den Führungskräften, Ingenieuren und Unternehmern, die die Branche prägen. Keine Hochglanzbroschüre, sondern ein echtes Gespräch, mit den Fragen, die sich Studierende wirklich stellen."
    - "Seitdem waren Gäste von NGE, VNF, Autodesk oder Aecon bei uns am Mikro, in Frankreich wie international, mit Interviews auf Französisch und Italienisch."
  vision_titre: "Unsere Vision"
  vision_intro: "Impact will der Ort werden, an dem sich eine Generation von Ingenieuren ihre Meinung über Bau und Energie bildet."
  vision:
    - "<b>Alle Seiten der Branche zeigen</b>: von der Baustelle bis zum Ingenieurbüro, vom Start-up bis zum Großkonzern, in Frankreich wie im Ausland."
    - "<b>Allen Studierenden helfen</b>, Praktikum und Beruf bewusst zu wählen und dann über den Impact-Talentpool auch zu ergattern."
    - "<b>Studierenden eine Stimme geben</b>: Bald können sie ihre Praktikumsberichte teilen und Unternehmen anonym bewerten."
    - "<b>Mit anderen Hochschulen wachsen</b>: ein Netzwerk studentischer Medien an Ingenieurhochschulen, mit Podcasts und Vorträgen."
  bref_aria: "Impact ESTP auf einen Blick"
  cree_en: "Gegründet"
  cree_en_v: "März 2026"
  structure: "Rechtsform"
  structure_v: "Verein nach dem französischen Vereinsgesetz von 1901"
  ecole: "Hochschule"
  ecole_v: "ESTP Paris, Campus Cachan"
  fondateur: "Gründer"
  suivre: "Folge uns"
  equipe_label: "Wir suchen Verstärkung"
  equipe_titre: "Komm ins Team"
  equipe_intro: "Du studierst an der ESTP und willst durch Machen lernen? Komm in die Redaktion. Erfahrung brauchst du keine, nur Lust und jede Woche ein bisschen Zeit."
  equipe_faire: "Das kannst du bei Impact machen:"
  equipe_roles:
    - "<b>Videoschnitt</b> der Interviews und Shorts."
    - "<b>Dreh</b> im Studio und auf Baustellen."
    - "<b>Schreiben</b> der Artikel, die jedes Interview begleiten."
    - "<b>Soziale Medien</b>: LinkedIn, Instagram, YouTube."
    - "<b>Partnerschaften</b>: Gäste und Partnerunternehmen finden."

