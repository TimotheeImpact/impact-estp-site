    - q: "Does it cost anything?"
      r: "No. The talent pool is free for students and recent graduates, and always will be."
    - q: "Who sees my information?"
      r: "Only the Impact ESTP team. A company only receives your profile if you've said yes for that specific offer."
    - q: "I'm not at ESTP. Can I sign up?"
      r: "Yes. The talent pool is open to all students aiming for construction, public works or energy, whatever their school."
    - q: "How do I unsubscribe?"
      r: "Email us at %email% and we'll delete your information."

