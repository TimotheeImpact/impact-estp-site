apropos:
  label: "About"
  titre: "Showing the sector as it really is, through the people who do the work"
  intro: "Impact ESTP is the first student media dedicated to construction and energy."
  pourquoi_titre: "Why Impact"
  pourquoi:
    - "Students are asked to commit to a sector they barely know, while being shown only one side of it. Yet careers in construction and energy are hugely diverse."
    - "In March 2026, students at ESTP Paris launched Impact to change that: unfiltered video interviews, 25 to 50 minutes long, with the leaders, engineers and entrepreneurs who make the sector. Not a brochure, but a real conversation, with the questions students actually ask themselves."
    - "Since then, guests from the likes of NGE, VNF, Autodesk and Aecon have been on the mic, in France and internationally, with interviews in French and Italian."
  vision_titre: "Our vision"
  vision_intro: "Impact wants to become the place where a generation of engineers forms its view of construction and energy."
  vision:
    - "<b>Show every side of the sector</b>: from the site to the design office, from start-ups to major groups, in France and abroad."
    - "<b>Help every student choose</b> their internship and career with their eyes open, then land it through the Impact talent pool."
    - "<b>Give students a voice</b>: soon, they'll be able to share their internship reports and rate companies anonymously."
    - "<b>Grow with other schools</b>: a network of student media in engineering schools, with podcasts and talks."
  bref_aria: "Impact ESTP at a glance"
  cree_en: "Founded"
  cree_en_v: "March 2026"
  structure: "Legal status"
  structure_v: "Non-profit association (French law of 1901)"
  ecole: "School"
  ecole_v: "ESTP Paris, Cachan campus"
  fondateur: "Founder"
  suivre: "Follow us"
  equipe_label: "We're recruiting"
  equipe_titre: "Join the team"
  equipe_intro: "Studying at ESTP and want to learn by doing? Join the editorial team. No experience needed, just motivation and a bit of time each week."
  equipe_faire: "What you can do at Impact:"
  equipe_roles:
    - "<b>Video editing</b> of the interviews and Shorts."
    - "<b>Filming</b> in the studio and on construction sites."
    - "<b>Writing</b> the articles that go with each interview."
    - "<b>Social media</b>: LinkedIn, Instagram, YouTube."
    - "<b>Partnerships</b>: finding guests and partner companies."

