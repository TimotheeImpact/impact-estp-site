apropos:
  label: "À propos"
  titre: "Montrer le secteur tel qu'il est, par ceux qui le font"
  intro: "Impact ESTP est le premier média étudiant dédié à la construction et à l'énergie."
  pourquoi_titre: "Pourquoi Impact"
  pourquoi:
    - "On demande aux étudiants de s'engager dans un secteur qu'ils connaissent mal, en ne leur montrant qu'un seul visage. Pourtant, les métiers de la construction et de l'énergie sont d'une diversité immense."
    - "En mars 2026, des étudiants de l'ESTP Paris ont lancé Impact pour changer ça : des interviews vidéo sans filtre, de 25 à 50 minutes, avec les dirigeants, ingénieurs et entrepreneurs qui font le secteur. Pas une plaquette, une vraie conversation, avec les questions qu'un étudiant se pose vraiment."
    - "Depuis, des invités de NGE, VNF, Autodesk ou Aecon sont passés au micro, en France comme à l'international, avec des interviews en français et en italien."
  vision_titre: "Notre vision"
  vision_intro: "Impact veut devenir le lieu où une génération d'ingénieurs se forge son opinion sur la construction et l'énergie."
  vision:
    - "<b>Montrer tous les visages du secteur</b> : du chantier au bureau d'études, de la start-up au grand groupe, en France comme à l'étranger."
    - "<b>Aider chaque étudiant à choisir</b> son stage et son métier en connaissance de cause, puis à le décrocher grâce au vivier Impact."
    - "<b>Donner la parole aux étudiants</b> : bientôt, ils pourront partager leurs rapports de stage et noter les entreprises, de façon anonyme."
    - "<b>Grandir avec les autres écoles</b> : un réseau de médias étudiants dans les écoles d'ingénieurs, avec des podcasts et des conférences."
  bref_aria: "Impact ESTP en bref"
  cree_en: "Créé en"
  cree_en_v: "Mars 2026"
  structure: "Structure"
  structure_v: "Association loi 1901"
  ecole: "École"
