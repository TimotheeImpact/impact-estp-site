    - q: "Est-ce que c'est payant ?"
      r: "Non. Le vivier est gratuit pour les étudiants et les jeunes diplômés, et le restera."
    - q: "Qui voit mes informations ?"
      r: "Seule l'équipe d'Impact ESTP. Une entreprise ne reçoit ton profil que si tu as dit oui pour cette offre précise."
