apropos:
  label: "Chi siamo"
  titre: "Mostrare il settore così com'è, attraverso chi lo fa"
  intro: "Impact ESTP è il primo media studentesco dedicato alle costruzioni e all'energia."
  pourquoi_titre: "Perché Impact"
  pourquoi:
    - "Si chiede agli studenti di impegnarsi in un settore che conoscono poco, mostrandone un solo volto. Eppure i mestieri delle costruzioni e dell'energia sono di una varietà immensa."
    - "A marzo 2026, alcuni studenti dell'ESTP Paris hanno lanciato Impact per cambiare le cose: interviste video senza filtri, dai 25 ai 50 minuti, con i dirigenti, gli ingegneri e gli imprenditori che fanno il settore. Non una brochure, ma una vera conversazione, con le domande che uno studente si pone davvero."
    - "Da allora, ospiti di realtà come NGE, VNF, Autodesk o Aecon sono passati dal nostro microfono, in Francia come all'estero, con interviste in francese e in italiano."
  estp_label: "La nostra scuola"
  estp_titre: "L'ESTP in breve"
  estp:
    - "L'ESTP è la grande scuola di ingegneria francese delle costruzioni. Fondata nel 1891 da Léon Eyrolles e riconosciuta dallo Stato dal 1921, forma ingegneri e quadri dell'edilizia, delle opere pubbliche e dell'energia in sei campus: Cachan, Parigi, Digione, Troyes, Orléans e Aix-en-Provence."
    - "Oltre 50.000 diplomati lavorano oggi nel settore, riuniti nell'associazione ESTP Alumni. Impact ESTP è un'associazione di studenti della scuola, creata con il suo consenso."
  estp_site: "https://www.estp.fr/en/home-page/"
  estp_site_btn: "Il sito dell'ESTP"
  estp_alumni_btn: "ESTP Alumni, la rete dei diplomati"
  vision_titre: "La nostra visione"
  vision_intro: "Impact vuole diventare il luogo dove una generazione di ingegneri si forma un'opinione sulle costruzioni e sull'energia."
  vision:
    - "<b>Mostrare tutti i volti del settore</b>: dal cantiere all'ufficio tecnico, dalla start-up al grande gruppo, in Francia come all'estero."
    - "<b>Aiutare ogni studente a scegliere</b> il proprio stage e il proprio mestiere con cognizione di causa, e poi a ottenerlo grazie al bacino di talenti Impact."
    - "<b>Dare la parola agli studenti</b>: presto potranno condividere i loro resoconti di stage e valutare le aziende in forma anonima."
    - "<b>Crescere con le altre scuole</b>: una rete di media studenteschi nelle scuole di ingegneria, con podcast e conferenze."
  bref_aria: "Impact ESTP in breve"
  cree_en: "Fondato"
  cree_en_v: "Marzo 2026"
