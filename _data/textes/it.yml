# Page « Installer l'appli » (/appli/) et bouton dans le pied de page et le menu mobile
appli:
  bouton: "Installa l'app"
  label: "App"
  titre: "Impact ESTP in tasca"
  intro: "Nessuno store: il sito si installa come un'app, con la sua icona nella schermata Home. Gratis, senza creare un account."
  direct: "Installa ora"
  deja: "L'app è installata su questo dispositivo. Buona lettura!"
  comment: "Come installarla"
  note: "L'app mostra gli stessi contenuti del sito, sempre aggiornati. Per toglierla, eliminala come qualsiasi altra app."
  appareils:
    - t: "iPhone e iPad"
      etapes:
        - "Apri impactestp.fr in Safari."
        - "Tocca il pulsante Condividi (il quadrato con la freccia verso l'alto), a volte nel menu « ⋯ »."
        - "Scegli « Aggiungi alla schermata Home », poi « Aggiungi »."
    - t: "Android"
      etapes:
        - "Apri impactestp.fr in Chrome."
        - "Tocca il menu ⋮ in alto a destra."
        - "Scegli « Installa app » o « Aggiungi a schermata Home »."
    - t: "Computer"
      etapes:
        - "Apri impactestp.fr in Chrome o Edge."
        - "Clicca sull'icona di installazione a destra della barra degli indirizzi."
        - "Conferma con « Installa »."

