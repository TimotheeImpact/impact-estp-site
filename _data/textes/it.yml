stages:
  label: "Stage e primo impiego"
  titre: "Il tuo stage nelle costruzioni e nell'energia"
  intro: "Scopri le offerte di stage, entra nel vivaio e prepara le tue candidature con le nostre schede aziendali."
  vivier_label: "Il bacino di talenti"
  vivier_titre: "Entra nel bacino di talenti Impact"
  vivier_intro: "Le aziende che intervistiamo cercano stagisti e giovani ingegneri. Lasciaci il tuo profilo: quando un'offerta corrisponde, te la inoltriamo in via prioritaria."
  etape1: "Compili il modulo in un minuto. È gratis."
  etape2: "Ti contattiamo quando un'offerta di stage, apprendistato o lavoro corrisponde alla tua ricerca."
  etape3: "Sei tu a scegliere se il tuo profilo viene presentato all'azienda. Nulla viene trasmesso senza il tuo consenso."
  bientot_espace: "I resoconti di stage e le recensioni anonime sulle aziende, condivisi dagli studenti in un'area riservata ai membri."
  ouverture: "Iscrizioni aperte dal 15 novembre 2026."
  offres_label: "Offerte delle aziende"
  offres_titre: "Le offerte di stage"
  offres_intro: "Stage, apprendistato e primi impieghi nelle costruzioni e nell'energia: prima le offerte trovate da Impact, poi quelle che l'ESTP pubblica su JobTeaser."
  offres_vide: "Le prime offerte saranno pubblicate qui. Iscriviti al bacino di talenti per riceverle in anteprima"
  offres_vide_date: ", dalla sua apertura il 15 novembre 2026"
  offres_impact_titre: "Le offerte Impact"
  offres_impact_intro: "Offerte che troviamo noi, spesso presso le aziende passate al nostro microfono."
  jt_titre: "Le offerte dell'ESTP su JobTeaser"
  jt_intro: "La scuola pubblica le sue offerte su JobTeaser, in tre categorie. Eccole, aggiornate al 10 ottobre 2026; per candidarti, accedi a JobTeaser con il tuo account ESTP."
  jt_nombre: "offerte"
  jt_btn: "Vedi le offerte su JobTeaser"
  jt_acces: "Accesso con il tuo account ESTP."
  jt_releve: "Dati rilevati il %date%."
  jt_vide: "Nessuna di queste offerte è ancora pubblicata qui: aspettiamo il consenso delle aziende."
  jt_cats:
    ciblee:
      titre: "Offerte mirate"
      texte: "L'azienda cerca proprio un candidato dell'ESTP."
    partenaire:
      titre: "Offerte partner"
      texte: "Pubblicate da un'azienda partner della scuola."
    reseau:
      titre: "Offerte della rete della scuola"
      texte: "Pubblicate da alumni e studenti dell'ESTP."
  recrutez: "<b>State assumendo?</b> Inviateci la vostra offerta di stage, apprendistato o lavoro: la pubblichiamo qui e la inoltriamo ai profili del bacino di talenti più adatti."
  proposer_offre: "Proponete un'offerta"
  entreprises_label: "Prima di candidarti"
  entreprises_titre: "Scopri le aziende"
  entreprises_intro: "Ogni scheda riunisce le nostre interviste, i nostri articoli e le offerte dell'azienda: tutto il necessario per arrivare al colloquio sapendo di cosa parli."
  faq_label: "Domande"
  faq_titre: "Domande frequenti"
  faq:
    - q: "È a pagamento?"
      r: "No. Il bacino di talenti è gratuito per studenti e neolaureati, e lo resterà."
    - q: "Chi vede i miei dati?"
      r: "Solo il team di Impact ESTP. Un'azienda riceve il tuo profilo solo se hai detto sì per quell'offerta specifica."
    - q: "Non sono all'ESTP, posso iscrivermi?"
      r: "Sì. Il bacino di talenti è aperto a tutti gli studenti che puntano alle costruzioni, ai lavori pubblici o all'energia, qualunque sia la loro scuola."
    - q: "Come faccio a cancellarmi?"
      r: "Scrivici a %email% e cancelliamo i tuoi dati."

