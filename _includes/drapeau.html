{%- comment -%} Petit drapeau : code="fr", "en", "it" ou "de" ; uid = identifiant unique dans la page (pour le drapeau anglais). {%- endcomment -%}
{%- if include.code == "fr" -%}
<svg class="drapeau" viewBox="0 0 3 2" width="21" height="14" aria-hidden="true"><rect width="1" height="2" fill="#002654"/><rect x="1" width="1" height="2" fill="#ffffff"/><rect x="2" width="1" height="2" fill="#ce1126"/></svg>
{%- elsif include.code == "de" -%}
<svg class="drapeau" viewBox="0 0 5 3" width="21" height="14" preserveAspectRatio="none" aria-hidden="true"><rect width="5" height="1" fill="#000000"/><rect y="1" width="5" height="1" fill="#dd0000"/><rect y="2" width="5" height="1" fill="#ffce00"/></svg>
{%- elsif include.code == "it" -%}
<svg class="drapeau" viewBox="0 0 3 2" width="21" height="14" aria-hidden="true"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#ffffff"/><rect x="2" width="1" height="2" fill="#ce2b37"/></svg>
{%- else -%}
<svg class="drapeau" viewBox="0 0 60 40" width="21" height="14" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><clipPath id="uk-t-{{ include.uid }}"><path d="M30,20 h30 v20 z v20 h-30 z h-30 v-20 z v-20 h30 z"/></clipPath><rect width="60" height="40" fill="#012169"/><path d="M0,0 L60,40 M60,0 L0,40" stroke="#ffffff" stroke-width="8"/><path d="M0,0 L60,40 M60,0 L0,40" clip-path="url(#uk-t-{{ include.uid }})" stroke="#c8102e" stroke-width="5"/><path d="M30,0 v40 M0,20 h60" stroke="#ffffff" stroke-width="12"/><path d="M30,0 v40 M0,20 h60" stroke="#c8102e" stroke-width="7"/></svg>
{%- endif -%}
