<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f1f3f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1a1f" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="{{ '/assets/fonts/archivo-latin-wdth-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/newsreader-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" href="{{ '/assets/img/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  {%- if site.cloudflare_analytics != "" and jekyll.environment == "production" %}
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "{{ site.cloudflare_analytics }}"}'></script>
  {%- endif %}
  {% feed_meta %}
  {% seo %}
</head>
<body>
  <a class="skip" href="#contenu">Aller au contenu</a>
  {% include header.html %}
  <main id="contenu" class="wrap">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
